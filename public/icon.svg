<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#10b981"/>
      <stop offset="1" stop-color="#047857"/>
    </linearGradient>
  </defs>
  <!-- Rounded background -->
  <rect width="512" height="512" rx="110" fill="url(#bg)"/>
  <!-- Inner glow circle -->
  <circle cx="256" cy="256" r="200" fill="#047857" opacity="0.25"/>
  <!-- Wholesale package (open box) -->
  <g>
    <!-- shadow -->
    <ellipse cx="256" cy="436" rx="150" ry="16" fill="#022c22" opacity="0.25"/>
    <!-- top face -->
    <path d="M256 104 L404 186 L256 268 L108 186 Z" fill="#ffffff"/>
    <!-- left face -->
    <path d="M108 186 L256 268 L256 428 L108 346 Z" fill="#e7f7f0"/>
    <!-- right face -->
    <path d="M404 186 L256 268 L256 428 L404 346 Z" fill="#cdeede"/>
    <!-- tape line on top -->
    <path d="M256 104 L256 268" stroke="#a7f3d0" stroke-width="10"/>
    <path d="M256 104 L256 190" stroke="#059669" stroke-width="10" opacity="0.5"/>
  </g>
</svg>
